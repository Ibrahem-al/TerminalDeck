appId: app.terminaldeck.desktop
productName: TerminalDeck
directories:
  buildResources: build
  output: dist
files:
  - out/**
# node-pty ships native binaries (.node / conpty.dll / OpenConsole.exe) that
# cannot be loaded from inside an asar archive — keep them unpacked.
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: resources/shell-integration
    to: shell-integration
# In-app auto-update + downloads read from this repo's GitHub Releases.
publish:
  provider: github
  owner: Ibrahem-al
  repo: TerminalDeck
  # Publish immediately (not a draft) so releases/latest/download and the
  # in-app updater can see it.
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TerminalDeck
  # Version-less, dashed name so the website's stable releases/latest/download/
  # link never needs bumping and electron-updater's latest.yml points at the
  # same asset. (latest.yml records the version separately.)
  artifactName: ${productName}-Setup.${ext}
# node-pty ships prebuilt N-API binaries (ABI-stable), so don't recompile from
# source — there's no C++ toolchain and the prebuilt binary already works.
npmRebuild: false
